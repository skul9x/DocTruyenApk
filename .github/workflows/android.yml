name: Android CI/CD Build & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 2. Tự động chuyển đổi tên ứng dụng (Slugify App Name)
      - name: Slugify App Name
        id: app_name
        run: |
          RAW_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_NAME" ]; then
            RAW_NAME="doctruyen-apk"
          fi
          # Chuyển chữ thường, thay khoảng trắng và dấu gạch dưới (_) bằng gạch ngang (-)
          SLUG_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[ _]+/-/g' | sed -E 's/^-+|-+$//g')
          echo "App Slug Name: $SLUG_NAME"
          echo "APP_NAME=$SLUG_NAME" >> $GITHUB_OUTPUT

      # 3. Tự động xác định hoặc tăng phiên bản Release (Smart Versioning)
      - name: Determine Next Release Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Kiểm tra nếu commit hiện tại đã được gắn tag cụ thể (ví dụ: v1.7)
          EXACT_TAG=$(git describe --tags --exact-match 2>/dev/null || true)
          if [ -n "$EXACT_TAG" ]; then
            NEW_VERSION="$EXACT_TAG"
            echo "Current commit has exact tag: $NEW_VERSION"
          else
            # 2. Lấy tag mới nhất từ GitHub Release (nếu có)
            LATEST_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)

            if [ -z "$LATEST_TAG" ]; then
              NEW_VERSION="v1.0"
              echo "No existing releases found. Initializing version to $NEW_VERSION"
            else
              echo "Latest Release Tag found: $LATEST_TAG"
              # Kiểm tra xem release mới nhất đã có file APK đính kèm chưa
              HAS_APK=$(gh release view "$LATEST_TAG" --json assets -q '.assets[] | select(.name | endswith(".apk")) | .name' 2>/dev/null || true)
              if [ -z "$HAS_APK" ]; then
                NEW_VERSION="$LATEST_TAG"
                echo "Latest release $LATEST_TAG does not have APK asset yet. Attaching to $NEW_VERSION"
              else
                # Bỏ ký tự 'v' ở đầu nếu có
                CLEAN_TAG="${LATEST_TAG#v}"
                MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
                MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)

                # Kiểm tra định dạng số hợp lệ
                if ! [[ "$MAJOR" =~ ^[0-9]+$ ]]; then MAJOR=1; fi
                if ! [[ "$MINOR" =~ ^[0-9]+$ ]]; then MINOR=0; fi

                NEW_MINOR=$((MINOR + 1))
                NEW_VERSION="v${MAJOR}.${NEW_MINOR}"
                echo "Incrementing version: $LATEST_TAG -> $NEW_VERSION"
              fi
            fi
          fi

          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      # 4. Build & Ký số APK
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secret 'KEYSTORE_BASE64' is missing or empty. Please add it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/skul9x.jks
          cp app/skul9x.jks skul9x.jks

      - name: Build & Sign Release APK
        env:
          STORE_FILE: skul9x.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::One or more signing secrets (STORE_PASSWORD/KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are missing. Please add them in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          ./gradlew :app:assembleRelease

      # 5. Đổi tên file APK theo chuẩn <slugified-app-name>-<version>.apk
      - name: Prepare and Rename APK
        id: prepare_apk
        run: |
          APP_NAME="${{ steps.app_name.outputs.APP_NAME }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          RELEASE_DIR="app/build/outputs/apk/release"
          SOURCE_APK="${RELEASE_DIR}/app-release.apk"
          TARGET_APK="${RELEASE_DIR}/${APP_NAME}-${VERSION}.apk"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "::error::Release APK not found at $SOURCE_APK"
            exit 1
          fi

          cp "$SOURCE_APK" "$TARGET_APK"
          echo "Prepared APK: $TARGET_APK"
          echo "APK_PATH=$TARGET_APK" >> $GITHUB_OUTPUT

      # Upload lên GitHub Release
      - name: Create or Update GitHub Release & Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          APK_PATH: ${{ steps.prepare_apk.outputs.APK_PATH }}
        run: |
          echo "Publishing release $VERSION with asset $APK_PATH"
          ls -lh "$APK_PATH"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Uploading APK asset..."
            gh release upload "$VERSION" "$APK_PATH" --clobber
          else
            echo "Creating new release $VERSION..."
            gh release create "$VERSION" "$APK_PATH" \
              --title "Release $VERSION" \
              --generate-notes
          fi
